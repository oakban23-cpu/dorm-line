<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>หอพัก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E7ECE8; --ink:#15221E; --muted:#5C6B65; --line:#D7DFDA;
  --brand:#1E5444; --brand-ink:#FFFFFF; --brass:#A87A22;
  --ok:#2D7A4C; --ok-bg:#E3F1E8; --info:#2C649F; --info-bg:#E3ECF7; --warn:#9C6B12; --warn-bg:#F6EDD9; --crit:#B03E2C; --crit-bg:#F7E4E0;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1513; --surface:#16201C; --sunk:#1D2925; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3833;
  --brand:#74B9A0; --brand-ink:#0E1513; --brass:#D6A649;
  --ok:#66C08B; --ok-bg:#183326; --info:#79A8E0; --info-bg:#192A3E; --warn:#E2AE52; --warn-bg:#352A14; --crit:#EB7A65; --crit-bg:#3A1C17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.key{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-body)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.summary div{background:var(--surface);padding:10px 12px}
.summary b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:600}
.summary span{color:var(--muted);font-size:12.5px}
.summary .crit b{color:var(--crit)} .summary .info b{color:var(--info)} .summary .ok b{color:var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.badge{background:var(--crit);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;font-family:var(--f-mono)}
.badge.info{background:var(--info)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0;font-size:16px}
select.in.inline{width:auto}
textarea.in{resize:vertical;min-height:72px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;width:100%}
.plate::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--stripe,transparent)}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.no{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1}
.no small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.who{font-weight:600}.who.vacant{color:var(--muted);font-weight:400}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13.5px}
.plate dt{color:var(--muted)} .plate dd{margin:0;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.muted{background:var(--sunk);color:var(--muted)}
.pill.sm{font-size:11.5px;padding:0 8px}
.line-ok{color:var(--ok);font-size:12px}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.slip{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.thumb{width:96px;height:128px;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px;border:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[disabled]{cursor:default}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:13px}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.head h3{font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.warnline{color:var(--warn);font-size:13px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px;background:var(--sunk)}
tr:last-child td{border-bottom:0}
.r{text-align:right}

.tenant{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.bigstatus{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--sunk);margin:12px 0}
.bigstatus .pill{align-self:flex-start;font-size:14px;padding:4px 12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{font-family:var(--f-display);font-size:16px;font-weight:600;margin:18px 0 8px}
.info-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.info-list dt{color:var(--muted)} .info-list dd{margin:0}
.code{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:.12em;user-select:all}
.center{max-width:420px;margin:8vh auto 0;text-align:center}
.center .card{text-align:left;margin-top:16px}

.ov{position:fixed;inset:0;background:rgb(10 18 15/.55);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel .x{float:right}
.ov.img{justify-content:center;align-items:center;padding:16px}
.ov.img img{max-height:92vh;border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){.tenant{grid-template-columns:1fr}}
@media (max-width:400px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="key" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="4.5"/><path d="M11.5 11.5 20 20M16.5 16.5l2-2M18.5 18.5l1.5-1.5"/></svg></div>
      <div style="min-width:0"><h1 id="dormName">หอพัก</h1><small id="sub"></small></div>
    </div>
    <button class="iconbtn" id="refresh" aria-label="โหลดข้อมูลใหม่" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  </header>
  <main id="main"><div class="center"><div class="spin"></div><p style="color:var(--muted)">กำลังเปิดแอป…</p></div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(() => {
'use strict';
const CFG = window.DORM_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const DAY = 864e5;
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const CUR = monthKey(today);
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const thMonth = k => { const [y,m] = k.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('th-TH', {month:'long', year:'numeric'}); };
const thDate = v => v ? new Date(v.length === 10 ? v + 'T00:00:00' : v).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'}) : '—';
const thTime = v => v ? new Date(v).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const baht = n => '฿' + Number(n || 0).toLocaleString('th-TH');
const parseD = s => s ? new Date(s + 'T00:00:00') : null;
const months = (() => { const a = []; for (let i = 1; i >= -6; i--) a.push(monthKey(new Date(today.getFullYear(), today.getMonth() + i, 1))); return a; })();
const ISSUE_CATS = ['ไฟฟ้า','ประปา','แอร์','อินเทอร์เน็ต','ประตู/กุญแจ','เฟอร์นิเจอร์','ความสะอาด','อื่นๆ'];
const ISSUE_ST = { new:['ใหม่','crit'], ack:['รับเรื่องแล้ว','warn'], doing:['กำลังซ่อม','info'], done:['เสร็จแล้ว','ok'] };
const params = new URLSearchParams(location.search);

let ME = null, A = null, T = null;     // me, adminData, tenantHome
const ui = { tab: 'rooms', month: CUR, filter: 'all', slipFilter: 'pending', rejectOpen: null, panel: null };
const imgCache = {};

/* ---------------- helpers ---------------- */
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3000); }
function fail(e){ console.error(e); toast(e && e.message ? e.message : 'ทำรายการไม่สำเร็จ ลองอีกครั้ง'); }
async function busy(btn, fn){ if (btn) btn.disabled = true; try { return await fn(); } catch (e) { fail(e); } finally { if (btn) btn.disabled = false; } }

async function api(action, data){
  let res;
  try {
    res = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data, idToken: liff.getIDToken() }) });
  } catch (e) { throw { message: 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' }; }
  const j = await res.json().catch(() => ({ ok: false, message: 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง' }));
  if (!j.ok) {
    if (j.code === 'auth_expired') { liff.logout(); liff.login({ redirectUri: location.href }); }
    throw j;
  }
  return j.data;
}

/** ย่อรูปก่อนส่ง (ด้านยาวสุด 1600px, JPEG) เพื่อให้ส่งเร็วและไม่เกินขนาด */
function compressImage(file, max = 1600){
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (!/^image\//.test(file.type)) return reject({ message: 'เลือกไฟล์รูปภาพเท่านั้น' });
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ message: 'เปิดรูปนี้ไม่ได้ ลองถ่ายหน้าจอสลิปแล้วเลือกใหม่' }); };
    img.src = url;
  });
}
async function loadImg(fileId){
  if (!fileId) return null;
  if (!imgCache[fileId]) imgCache[fileId] = api('getImage', { fileId }).catch(e => { delete imgCache[fileId]; throw e; });
  return imgCache[fileId];
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
const monthSelect = (id, val) => `<select class="in inline" id="${id}">${months.map(m => `<option value="${m}" ${m === val ? 'selected' : ''}>${esc(thMonth(m))}</option>`).join('')}</select>`;

/* ---------------- status logic ---------------- */
function dueDate(r, key){ const [y,m] = key.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return new Date(y, m-1, Math.min(Number(r.dueDay) || 1, last)); }
function payStatus(r, key, pays){
  if (!r.tenantName) return { code:'vacant', cls:'muted', label:'ห้องว่าง' };
  const ps = pays.filter(p => p.room === r.room && p.month === key).sort((a,b) => String(b.submittedAt).localeCompare(String(a.submittedAt)));
  if (ps.some(p => p.status === 'approved')) return { code:'paid', cls:'ok', label:'ปกติ · ชำระแล้ว' };
  if (ps.some(p => p.status === 'pending')) return { code:'pending', cls:'info', label:'รอตรวจสลิป' };
  const diff = Math.round((dueDate(r, key) - today) / DAY);
  if (diff < 0) return { code:'late', cls:'crit', label:`ค้างชำระ ${-diff} วัน` };
  if (ps[0]?.status === 'rejected') return { code:'rejected', cls:'crit', label:'สลิปไม่ผ่าน ส่งใหม่' };
  if (diff === 0) return { code:'soon', cls:'warn', label:'ครบกำหนดวันนี้' };
  if (diff <= 3) return { code:'soon', cls:'warn', label:`ครบกำหนดใน ${diff} วัน` };
  return { code:'unpaid', cls:'muted', label:'ยังไม่ถึงกำหนด' };
}
function contractStatus(r){
  const end = parseD(r.contractEnd); if (!r.tenantName || !end) return { cls:'muted', label:'—', days: Infinity };
  const d = Math.round((end - today) / DAY);
  if (d < 0) return { cls:'crit', label:'หมดสัญญาแล้ว', days:d };
  if (d <= 60) return { cls:'warn', label:`เหลือ ${d} วัน`, days:d };
  return { cls:'ok', label:`เหลือ ${Math.floor(d/30)} เดือน`, days:d };
}
const sortRooms = rs => rs.slice().sort((a,b) => String(a.room).localeCompare(String(b.room), 'th', { numeric:true }));

/* ---------------- shared cards ---------------- */
function slipCard(p, owner){
  const r = owner ? (A.rooms.find(x => x.room === p.room) || {}) : T.room;
  const st = p.status === 'approved' ? ['ยืนยันแล้ว','ok'] : p.status === 'rejected' ? ['ไม่ผ่าน','crit'] : ['รอตรวจ','info'];
  const mismatch = r.rent && Number(p.amount) !== Number(r.rent);
  const thumb = p.fileId ? `<button class="thumb" data-img="${esc(p.fileId)}" aria-label="ดูสลิป">${imgThumb(p.fileId)}</button>` : `<div class="thumb">${p.by === 'owner' ? 'ไม่มีสลิป<br>(บันทึกโดยหอ)' : 'ไม่มีรูป'}</div>`;
  return `<article class="card slip">${thumb}
    <div style="min-width:0">
      <div class="head"><h3>${owner ? `ห้อง <span class="num">${esc(p.room)}</span> · ` : ''}${esc(thMonth(p.month))}</h3><span class="pill ${st[1]}">${st[0]}</span></div>
      <div class="meta">${owner ? `<span>${esc(r.tenantName || '—')}</span>` : ''}<span>${esc(thTime(p.submittedAt))}</span>${p.by === 'owner' ? '<span>บันทึกโดยเจ้าของหอ</span>' : ''}</div>
      <p style="margin:6px 0 0"><span class="num" style="font-size:19px;font-weight:600">${baht(p.amount)}</span>${owner && mismatch ? `<span class="warnline"> · ไม่ตรงค่าเช่า (${baht(r.rent)})</span>` : ''}</p>
      ${p.note ? `<p class="meta" style="margin:4px 0 0">หมายเหตุ: ${esc(p.note)}</p>` : ''}
      ${p.status === 'rejected' && p.reason ? `<p class="warnline" style="margin:4px 0 0">เหตุผล: ${esc(p.reason)}</p>` : ''}
      ${owner && p.status === 'pending' ? (ui.rejectOpen === p.id
        ? `<div class="actions"><input class="in" id="rej-${esc(p.id)}" placeholder="เหตุผล เช่น ยอดไม่ครบ" style="flex:1;min-width:150px"><button class="btn danger sm" data-reject-confirm="${esc(p.id)}">ยืนยันไม่ผ่าน</button><button class="btn sm" data-reject-cancel>ยกเลิก</button></div>`
        : `<div class="actions"><button class="btn ok" data-approve="${esc(p.id)}">✓ ยืนยันสลิป</button><button class="btn danger sm" data-reject="${esc(p.id)}">ไม่ผ่าน</button></div>`) : ''}
      ${owner && p.status !== 'pending' ? `<div class="actions"><button class="btn sm" data-undo="${esc(p.id)}">ย้อนเป็นรอตรวจ</button></div>` : ''}
    </div></article>`;
}
function imgThumb(fileId){
  const c = imgCache[fileId];
  if (c && c.done) return `<img src="${esc(c.done)}" alt="สลิป">`;
  return 'แตะเพื่อดูสลิป';

function renderAdmin(){

const tabBtn = (id, label, extra = '') => `<button role="tab" data-tab="${id}" aria-selected="${ui.tab === id}">${label}${extra}</button>`;
function roomsTab(rooms){

async function autoloadThumbs(){

function issuesTab(){

    $('#payForm').onsubmit = e => { e.preventDefault(); const btn = e.target.querySelector('[type=submit]');
      busy(btn, async () => {
        const f = $('#pfSlip').files[0]; if (!f) throw { message: 'แนบรูปสลิปก่อนส่ง' };
        const image = await compressImage(f);
        await api('submitSlip', { month: $('#pfMonth').value, amount: $('#pfAmount').value, note: $('#pfNote').value, image });
        e.target.reset(); $('#pfAmount').value = r.rent ?? '';
        toast('ส่งสลิปแล้ว รอเจ้าของหอยืนยัน'); await loadTenant();
      });
    };
    $('#issueForm').onsubmit = e => { e.preventDefault(); const btn = e.target.querySelector('[type=submit]');
      busy(btn, async () => {
        const image = await compressImage($('#isPhoto').files[0]);
        await api('reportIssue', { category: $('#isCat').value, title: $('#isTitle').value, detail: $('#isDetail').value, image });
        e.target.reset(); toast('ส่งเรื่องแล้ว หอจะแจ้งความคืบหน้าทาง LINE'); await loadTenant();
      });
    };
  }
  const s = payStatus(r, CUR, T.payments), c = contractStatus(r), due = dueDate(r, CUR);
  $('#tStatus').innerHTML = `<div class="head"><h2 style="font-size:22px">ห้อง <span class="num">${esc(r.room)}</span></h2><span class="meta">${esc(r.tenantName || ME.name)}</span></div>
    <div class="bigstatus"><span class="meta">ค่าเช่า ${esc(thMonth(CUR))}</span><span class="pill ${s.cls}">${esc(s.label)}</span>
      <span><span class="num" style="font-size:21px;font-weight:600">${baht(r.rent)}</span> · กำหนดชำระ ${esc(thDate(fmtISO(due)))}</span></div>
    <dl class="info-list"><dt>เก็บเงินทุก</dt><dd>วันที่ ${esc(r.dueDay)} ของเดือน</dd>
      <dt>สัญญา</dt><dd>${esc(thDate(r.contractStart))} – ${esc(thDate(r.contractEnd))} <span class="pill sm ${c.cls}">${esc(c.label)}</span></dd>
      <dt>เงินประกัน</dt><dd class="num">${baht(r.deposit)}</dd></dl>
    <h3 class="sect">ประวัติการชำระ</h3>
    ${T.payments.length ? `<div class="list">${T.payments.map(p => slipCard(p, false)).join('')}</div>` : `<div class="empty">ยังไม่มีการส่งสลิป</div>`}
    <h3 class="sect">เรื่องที่แจ้ง</h3>
    ${T.issues.length ? `<div class="list">${T.issues.map(i => issueCard(i, false)).join('')}</div>` : `<div class="empty">ยังไม่มีเรื่องที่แจ้ง</div>`}`;
}

/* ================= ONBOARDING ================= */
function renderRegister(){
  const room = params.get('room') || '', code = params.get('code') || '';
  $('#main').innerHTML = `<div class="center">
    <h2 style="font-size:22px">ลงทะเบียนห้องพัก</h2>
    <p style="color:var(--muted)">สวัสดี ${esc(ME.name || '')} ใส่เลขห้องและรหัสที่ได้รับจากเจ้าของหอ</p>
    <form class="form card" id="regForm">
      <label>เลขห้อง<input class="in num" id="rgRoom" required value="${esc(room)}" autocomplete="off"></label>
      <label>รหัสลงทะเบียน<input class="in num" id="rgCode" required value="${esc(code)}" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em"></label>
      <button class="btn pri block" type="submit">ลงทะเบียน</button>
    </form>
    <p style="margin-top:28px"><button class="btn sm" id="iAmOwner">${ME.needsOwnerSetup ? 'ฉันเป็นเจ้าของหอ (ตั้งค่าครั้งแรก)' : 'ฉันเป็นเจ้าของหอ / ผู้ดูแล'}</button></p>
  </div>`;
  $('#regForm').onsubmit = e => { e.preventDefault(); const btn = e.target.querySelector('[type=submit]');
    busy(btn, async () => { await api('register', { room: $('#rgRoom').value, code: $('#rgCode').value }); toast('ลงทะเบียนสำเร็จ'); await start(); });
  };
  $('#iAmOwner').onclick = renderOwnerClaim;
  if (ME.needsOwnerSetup && !room) renderOwnerClaim();
}
function renderOwnerClaim(){
  $('#main').innerHTML = `<div class="center">
    <h2 style="font-size:22px">ยืนยันเจ้าของหอ</h2>
    <p style="color:var(--muted)">ใส่รหัสเจ้าของหอ (OWNER_CODE) ที่ได้ตอนรัน setup ใน Apps Script</p>
    <form class="form card" id="ownForm">
      <label>รหัสเจ้าของหอ<input class="in num" id="owCode" required autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em"></label>
      <button class="btn pri block" type="submit">ยืนยัน</button>
    </form>
    <p style="margin-top:20px"><button class="btn sm" id="back">ฉันเป็นผู้เช่า</button></p></div>`;
  $('#ownForm').onsubmit = e => { e.preventDefault(); const btn = e.target.querySelector('[type=submit]');
    busy(btn, async () => { await api('claimAdmin', { code: $('#owCode').value }); toast('ตั้งเป็นเจ้าของหอแล้ว'); await start(); });
  };
  $('#back').onclick = renderRegister;
}
function renderError(msg){
  $('#main').innerHTML = `<div class="center"><h2 style="font-size:20px">เปิดแอปไม่สำเร็จ</h2><p style="color:var(--muted)">${esc(msg)}</p><button class="btn pri" id="retry">ลองใหม่</button></div>`;
  $('#retry').onclick = () => location.reload();
}
function setDorm(n){ $('#dormName').textContent = n; document.title = n; }

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-room]'); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) return closePanel();
  if (d.img) return showImg(d.img, t);
  if (!A) return;
  if (d.tab) { ui.tab = d.tab; ui.rejectOpen = null; return renderAdmin(); }
  if (d.filter) { ui.filter = d.filter; return renderAdmin(); }
  if (d.slipf) { ui.slipFilter = d.slipf; return renderAdmin(); }
  if (d.room) return openRoom(d.room);
  if (d.act === 'newRoom') return openRoomForm(null);
  if (d.act === 'editRoom') return openRoomForm(d.no);
  if (d.act === 'openRoom') return openRoom(d.no);
  if (d.act === 'recordPay') return openRecordPay(d.no);
  if (d.act === 'remind') return busy(t, async () => { await api('remind', { room: d.no, month: ui.month }); toast('ส่งแจ้งเตือนทาง LINE แล้ว'); });
  if (d.approve) return busy(t, async () => { await api('review', { id: d.approve, decision: 'approved' }); toast('ยืนยันแล้ว ผู้เช่าได้รับแจ้งทาง LINE'); await loadAdmin(); });
  if (d.reject) { ui.rejectOpen = d.reject; renderAdmin(); setTimeout(() => document.getElementById('rej-' + d.reject)?.focus(), 0); return; }
  if (d.rejectCancel !== undefined) { ui.rejectOpen = null; return renderAdmin(); }
  if (d.rejectConfirm) { const reason = (document.getElementById('rej-' + d.rejectConfirm)?.value || '').trim();
    return busy(t, async () => { await api('review', { id: d.rejectConfirm, decision: 'rejected', reason }); ui.rejectOpen = null; toast('แจ้งผู้เช่าให้ส่งสลิปใหม่แล้ว'); await loadAdmin(); }); }
  if (d.undo) return busy(t, async () => { await api('review', { id: d.undo, decision: 'pending' }); await loadAdmin(); });
  if (d.issue) { const reply = document.getElementById('reply-' + d.issue)?.value;
    return busy(t, async () => { await api('setIssueStatus', { id: d.issue, status: d.st, reply }); toast('อัปเดตเป็น "' + ISSUE_ST[d.st][0] + '" และแจ้งผู้เช่าแล้ว'); await loadAdmin(); }); }
});
document.addEventListener('change', e => { if (e.target.id === 'monthSel') { ui.month = e.target.value; renderAdmin(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const im = document.querySelector('.ov.img'); if (im) im.remove(); else closePanel(); } });
$('#refresh').onclick = () => busy($('#refresh'), async () => { if (ME && ME.isAdmin) await loadAdmin(); else if (T) await loadTenant(); toast('อัปเดตแล้ว'); });
let lastHidden = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { lastHidden = Date.now(); return; }
  if (Date.now() - lastHidden > 60000 && !$('#ov')) { if (ME?.isAdmin) loadAdmin().catch(() => {}); else if (T) loadTenant().catch(() => {}); }
});

/* ================= BOOT ================= */
async function start(){
  ME = await api('me');
  if (ME.dormName) setDorm(ME.dormName);
  $('#refresh').hidden = !(ME.isAdmin || ME.room);
  const view = params.get('view');
  if (ME.isAdmin) {
    $('#sub').textContent = 'เจ้าของหอ · ' + (ME.name || '');
    if (['slips','issues','contracts'].includes(view)) ui.tab = view;
    return loadAdmin();
  }
  if (ME.room) {
    $('#sub').textContent = 'ห้อง ' + ME.room.room;
    await loadTenant();
    const target = view === 'pay' ? '#paySec' : view === 'issue' ? '#issueSec' : null;
    if (target) setTimeout(() => $(target)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    return;
  }
  $('#sub').textContent = '';
  renderRegister();
}
async function boot(){
  try {
    if (!CFG.LIFF_ID || CFG.LIFF_ID.startsWith('PUT_')) return renderError('ยังไม่ได้ใส่ LIFF_ID และ API_URL ในไฟล์ config.js');
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    await start();
  } catch (e) { console.error(e); renderError(e && e.message ? e.message : 'เกิดข้อผิดพลาด'); }
}
boot();
})();
</script>
</body>
</html>
